name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_dataset.py
      - run: python scripts/validate_dataset.py --dataset dataset/cphos28-review/cases.jsonl
      - run: python scripts/validate_dataset.py --dataset dataset/cphos28-confirmation/cases.jsonl
      - run: python scripts/benchmark.py --backends baseline --split dev --output-dir results/ci-baseline
      - run: python scripts/benchmark_v4_claims.py --dataset dataset/cphos28/cases.jsonl --split dev --backends baseline --output-dir results/ci-current-baseline
